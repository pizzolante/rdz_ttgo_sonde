name: Build and Release TTGO Firmware

on:
  push:
    branches:
      - test

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      
      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio
      
      - name: Build firmware
        run: pio run -e ttgo-lora32
      
      - name: Get version info
        id: version
        run: |
          # Estrae la versione dal file version.h se esiste
          if [ -f "RX_FSK/version.h" ]; then
            VERSION=$(grep -oP 'version_id = "\K[^"]+' RX_FSK/version.h || echo "dev")
          else
            VERSION="dev"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "timestamp=$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT
          echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
      
      - name: Prepare release files
        run: |
          mkdir -p release
          cp .pio/build/ttgo-lora32/firmware.bin release/rdz_ttgo_sonde_firmware.bin
          # Copia anche il file partition table se esiste
          if [ -f ".pio/build/ttgo-lora32/partitions.bin" ]; then
            cp .pio/build/ttgo-lora32/partitions.bin release/partitions.bin
          fi
          # Crea un file con informazioni sulla build
          echo "Build: ${{ steps.version.outputs.version }}" > release/BUILD-INFO.txt
          echo "Commit: ${{ github.sha }}" >> release/BUILD-INFO.txt
          echo "Date: $(date)" >> release/BUILD-INFO.txt
      
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: test-${{ steps.version.outputs.timestamp }}-${{ steps.version.outputs.short_sha }}
          release_name: Test Build ${{ steps.version.outputs.version }} (${{ steps.version.outputs.timestamp }})
          body: |
            ## 🚀 Build automatica da branch test
            
            **Versione:** ${{ steps.version.outputs.version }}
            **Commit:** ${{ github.sha }}
            **Data:** ${{ steps.version.outputs.timestamp }}
            
            ### 📥 Come flashare
            
            1. Scarica il file `rdz_ttgo_sonde_firmware.bin`
            2. Usa esptool o PlatformIO per flashare il firmware sul tuo TTGO:
               ```
               esptool.py --port /dev/ttyUSB0 write_flash 0x10000 rdz_ttgo_sonde_firmware.bin
               ```
            
            ### ⚠️ Nota
            Questa è una build automatica dal branch di test. Potrebbe non essere stabile.
          draft: false
          prerelease: true
      
      - name: Upload Firmware
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./release/rdz_ttgo_sonde_firmware.bin
          asset_name: rdz_ttgo_sonde_firmware.bin
          asset_content_type: application/octet-stream
      
      - name: Upload Build Info
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./release/BUILD-INFO.txt
          asset_name: BUILD-INFO.txt
          asset_content_type: text/plain
